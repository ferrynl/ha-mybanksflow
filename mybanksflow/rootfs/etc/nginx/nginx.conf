worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8099;
        # Only Home Assistant Supervisor can access ingress.
        allow 172.30.32.2;
        deny all;
        root /web;
        index index.html;
        client_max_body_size 50m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location = /runtime-config.js { add_header Cache-Control "no-store"; }
        location /auth/v1/ { proxy_pass http://127.0.0.1:9999/; proxy_set_header Host $host; }
        location /rest/v1/ { proxy_pass http://127.0.0.1:3000/; }
        location /storage/v1/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            # Storage uses this origin for signed paths when applicable.
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;
        }
        location /functions/v1/ { proxy_pass http://127.0.0.1:9000/; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }
}